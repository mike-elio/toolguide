name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest -q

      - name: Audit adaptive knowledge
        run: python scripts/audit_phase6.py --knowledge data/knowledge/adaptive.json.gz

      - name: Compile Python sources
        run: python -m compileall -q app scripts

  javascript:
    name: Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run JavaScript tests
        run: node --test tests/*.test.cjs

  browser:
    name: Browser journeys (Arabic and English)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install test dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/toolguide-server.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/api/health
          npm run test:e2e
